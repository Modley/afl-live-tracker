
# Render "Blueprint" — lets Render auto-configure everything below in one go
# via New + -> Blueprint, instead of setting each field by hand.
services:
  - type: web
    name: afl-live-tracker
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_SOURCE
        value: squiggle
      - key: POLL_INTERVAL_MS
        value: 15000
      - key: SQUIGGLE_USER_AGENT
        value: "afl-live-tracker (contact: replace-with-your-email@example.com)"
      - key: CORS_ORIGIN
        value: "*"
